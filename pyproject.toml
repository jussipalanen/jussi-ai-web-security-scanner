[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jussiai-web-security-scanner"
version = "0.1.0"
description = "AI-powered, non-destructive web security scanner with a deterministic Python engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jussi Palanen" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "reportlab>=4.1",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
jussiai-scan = "jussiai_scanner.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pypdf>=4.2",
    "mypy>=1.10",
    "types-reportlab>=4.1",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jussiai_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
